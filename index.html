<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>in case you didnt love yourself today</title>

<style>

body{
font-family:Arial, sans-serif;
background:linear-gradient(to bottom,#f8e1e7,#eac7d2);
margin:0;
}

.container{
min-height:100vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
padding:40px;
}

button{
padding:12px 28px;
border:none;
border-radius:30px;
background:#ff4d6d;
color:white;
font-size:16px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.05);
}

/* PHOTO */

.photo{
margin-top:30px;
}

.photo img{
width:260px;
border-radius:18px;
opacity:0;
transition:1s;
}

.show-img{
opacity:1;
}

/* POEM */

#poem{
margin-top:35px;
font-size:18px;
line-height:1.9;
max-width:500px;
}

.line{
opacity:0;
transition:.8s;
}

.show-line{
opacity:1;
}

/* FADE OUT */

.fade-out{
opacity:0;
transition:1.5s;
}

/* VIDEO */

#videoSection{
margin-top:40px;
opacity:0;
transition:1.5s;
}

#videoSection video{
width:420px;
border-radius:18px;
}

.show-video{
opacity:1;
}

</style>
</head>

<body>

<div class="container">

<h1>in case you didnt love yourself today</h1>

<button id="loveButton" onclick="startStory()">❤️ Love</button>

<div class="photo">
<img id="mainPhoto" src="photo.jpg">
</div>

<div id="poem">

<div class="line">Aku harap kamu bisa melihat.</div>
<div class="line">Ribuan bintang jatuh dengan segala rasi dan zodiaknya.</div>
<div class="line">Dan aku jatuh untuk pelukmu,</div>
<div class="line">dan kamu memeluk ombak tenang dalam malam.</div>

</div>

<div id="videoSection">

<video controls>
<source src="video.mp4" type="video/mp4">
</video>

</div>

</div>

<script>

function startStory(){

const button = document.getElementById("loveButton");
button.innerHTML="❤️ Loved";
button.disabled=true;

/* SHOW PHOTO */

setTimeout(()=>{
document.getElementById("mainPhoto").classList.add("show-img");
},300);

/* POEM LINES */

const lines=document.querySelectorAll(".line");

lines.forEach((line,index)=>{
setTimeout(()=>{
line.classList.add("show-line");
},1000 + index*900);
});

/* FADE OUT PHOTO + POEM */

setTimeout(()=>{
document.getElementById("mainPhoto").classList.add("fade-out");
document.getElementById("poem").classList.add("fade-out");
},6000);

/* SHOW VIDEO */

setTimeout(()=>{
document.getElementById("videoSection").classList.add("show-video");
},7500);

}

</script>

</body>
</html>
