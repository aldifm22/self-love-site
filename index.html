<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>in case you didnt love yourself today</title>

<style>

body{
font-family:Arial, sans-serif;
background:linear-gradient(to bottom,#f8e1e7,#eac7d2);
margin:0;
}

.container{
min-height:100vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
padding:40px;
}

/* BUTTON */

button{
padding:12px 28px;
border:none;
border-radius:30px;
background:#ff4d6d;
color:white;
font-size:16px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.05);
}

/* PHOTO */

#photo{
display:none;
margin-top:30px;
}

#photo img{
width:260px;
border-radius:18px;
}

/* POEM */

#poem{
margin-top:35px;
font-size:18px;
line-height:1.9;
max-width:500px;
display:none;
}

.line{
opacity:0;
transition:0.8s;
}

.show-line{
opacity:1;
}

/* VIDEO */

#videoSection{
display:none;
margin-top:40px;
}

#videoSection video{
width:420px;
border-radius:18px;
}

</style>
</head>

<body>

<div class="container">

<h1>in case you didnt love yourself today</h1>

<button id="loveButton" onclick="startStory()">❤️ Love</button>

<div id="photo">
<img src="photo.jpg">
</div>

<div id="poem">

<div class="line">Aku harap kamu bisa melihat.</div>
<div class="line">Ribuan bintang jatuh dengan segala rasi dan zodiaknya.</div>
<div class="line">Dan aku jatuh untuk pelukmu,</div>
<div class="line">dan kamu memeluk ombak tenang dalam malam.</div>

</div>

<div id="videoSection">

<video controls>
<source src="video.mp4" type="video/mp4">
</video>

</div>

</div>

<script>

function startStory(){

const button=document.getElementById("loveButton");
button.innerHTML="❤️ Loved";
button.disabled=true;

/* SHOW PHOTO */

document.getElementById("photo").style.display="block";

/* SHOW POEM */

setTimeout(()=>{
document.getElementById("poem").style.display="block";
},800);

/* POEM LINE ANIMATION */

const lines=document.querySelectorAll(".line");

lines.forEach((line,index)=>{
setTimeout(()=>{
line.classList.add("show-line");
},1200+(index*900));
});

/* HIDE PHOTO + POEM */

setTimeout(()=>{
document.getElementById("photo").style.display="none";
document.getElementById("poem").style.display="none";
},6500);

/* SHOW VIDEO */

setTimeout(()=>{
document.getElementById("videoSection").style.display="block";
},7000);

}

</script>

</body>
</html>
