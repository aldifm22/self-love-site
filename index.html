<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>in case you didnt love yourself today</title>

<style>

body{
font-family:Arial, sans-serif;
background:linear-gradient(to bottom,#f8e1e7,#eac7d2);
margin:0;
}

.container{
min-height:100vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
padding:40px;
}

button{
padding:12px 28px;
border:none;
border-radius:30px;
background:#ff4d6d;
color:white;
font-size:16px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.05);
}

/* PHOTO GALLERY */

.gallery{
display:flex;
gap:20px;
margin-top:30px;
justify-content:center;
align-items:center;
}

.gallery img{
width:220px;
border-radius:18px;
opacity:0;
transform:translateY(20px);
transition:1s;
}

.show-img{
opacity:1;
transform:translateY(0);
}

/* POEM */

#poem{
margin-top:30px;
font-size:18px;
line-height:1.9;
max-width:500px;
}

.line{
opacity:0;
transform:translateY(15px);
transition:.8s;
}

.show-line{
opacity:1;
transform:translateY(0);
}

/* FADE OUT */

.fade-out{
opacity:0;
transition:1.5s;
}

/* VIDEO */

#videoSection{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
opacity:0;
transition:1.5s;
}

#videoSection video{
width:480px;
border-radius:20px;
}

.show-video{
opacity:1;
}

</style>
</head>

<body>

<div class="container">

<h1>in case you didnt love yourself today</h1>

<button id="loveButton" onclick="startStory()">❤️ Love</button>

<div class="gallery" id="gallery">
<img src="photo1.jpg">
<img src="photo2.jpg">
<img src="photo3.jpg">
</div>

<div id="poem">

<div class="line">Aku harap kamu bisa melihat.</div>
<div class="line">Ribuan bintang jatuh dengan segala rasi dan zodiaknya.</div>
<div class="line">Dan aku jatuh untuk pelukmu,</div>
<div class="line">dan kamu memeluk ombak tenang dalam malam.</div>

</div>

</div>

<div id="videoSection">

<video id="loveVideo" controls>
<source src="video.mp4" type="video/mp4">
</video>

</div>

<script>

function startStory(){

document.getElementById("loveButton").innerHTML="❤️ Loved";
document.getElementById("loveButton").disabled=true;

const images=document.querySelectorAll(".gallery img");

images.forEach((img,index)=>{
setTimeout(()=>{
img.classList.add("show-img");
},index*300);
});

const lines=document.querySelectorAll(".line");

lines.forEach((line,index)=>{
setTimeout(()=>{
line.classList.add("show-line");
},1000+(index*900));
});

/* fade out photos + poem */

setTimeout(()=>{
document.getElementById("gallery").classList.add("fade-out");
document.getElementById("poem").classList.add("fade-out");
},6000);

/* show video centered */

setTimeout(()=>{

const videoSection=document.getElementById("videoSection");
const video=document.getElementById("loveVideo");

videoSection.classList.add("show-video");

/* autoplay WITH sound */
video.play();

},7500);

}

</script>

</body>
</html>
