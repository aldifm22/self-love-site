<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>in case you didnt love yourself today</title>

<style>

body{
font-family:Arial, sans-serif;
margin:0;
background:linear-gradient(to bottom,#0b0c2a,#1a1c4a);
color:white;
overflow:hidden;
}

/* MOON */

.moon{
position:fixed;
top:80px;
right:120px;
width:120px;
height:120px;
border-radius:50%;
background:radial-gradient(circle at 30% 30%, #fff, #ddd 60%, #bbb);
box-shadow:0 0 40px rgba(255,255,255,0.6);
animation:moonFloat 6s ease-in-out infinite;
z-index:2;
}

@keyframes moonFloat{
0%{transform:translateY(0);}
50%{transform:translateY(-15px);}
100%{transform:translateY(0);}
}

/* MOON REFLECTION */

.moon-reflection{
position:fixed;
bottom:120px;
right:160px;
width:120px;
height:200px;
background:linear-gradient(
to bottom,
rgba(255,255,255,0.25),
rgba(255,255,255,0.15),
rgba(255,255,255,0.05),
transparent
);
filter:blur(8px);
opacity:.6;
animation:reflectionMove 8s ease-in-out infinite;
z-index:1;
}

@keyframes reflectionMove{
0%{transform:scaleX(1);}
50%{transform:scaleX(1.2);}
100%{transform:scaleX(1);}
}

/* FALLING STARS */

.stars{
position:fixed;
width:100%;
height:100%;
top:0;
left:0;
pointer-events:none;
}

.star{
position:absolute;
width:2px;
height:2px;
background:white;
animation:fall 5s linear infinite;
opacity:.8;
}

@keyframes fall{
0%{transform:translateY(-10vh);opacity:0;}
10%{opacity:1;}
100%{transform:translateY(110vh);opacity:0;}
}

/* SHOOTING STAR */

.shooting-star{
position:fixed;
width:120px;
height:2px;
background:linear-gradient(-45deg, white, rgba(255,255,255,0));
opacity:0;
transform:rotate(45deg);
pointer-events:none;
z-index:2;
}

@keyframes shoot{
0%{
transform:translate(0,0) rotate(45deg);
opacity:1;
}
100%{
transform:translate(800px,800px) rotate(45deg);
opacity:0;
}
}

/* OCEAN */

.ocean{
position:fixed;
bottom:0;
left:0;
width:100%;
height:140px;
overflow:hidden;
z-index:1;
}

.wave-svg{
position:absolute;
bottom:0;
width:200%;
height:100%;
animation:waveFlow 12s linear infinite;
}

.wave-svg:nth-child(2){
animation-duration:18s;
opacity:0.6;
}

@keyframes waveFlow{
0%{transform:translateX(0);}
100%{transform:translateX(-50%);}
}

/* MAIN CONTENT */

.container{
min-height:100vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
padding:40px;
position:relative;
z-index:3;
}

/* BUTTON */

button{
padding:12px 28px;
border:none;
border-radius:30px;
background:#ff4d6d;
color:white;
font-size:16px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.08);
}

/* PHOTO */

#photo{
display:none;
margin-top:30px;
}

#photo img{
width:260px;
border-radius:20px;
opacity:0;
transform:scale(.9);
transition:2s;
}

.show-photo{
opacity:1 !important;
transform:scale(1);
}

/* POEM */

#poem{
margin-top:35px;
font-size:18px;
line-height:1.9;
max-width:520px;
display:none;
}

.line{
opacity:0;
transform:translateY(15px);
transition:.8s;
}

.show-line{
opacity:1;
transform:translateY(0);
}

/* VIDEO */

#videoSection{
display:none;
margin-top:40px;
}

#videoSection video{
width:420px;
border-radius:20px;
box-shadow:0 0 25px rgba(255,255,255,.2);
}

</style>

</head>

<body>

<div class="moon"></div>
<div class="moon-reflection"></div>

<div class="stars" id="stars"></div>

<div class="container">

<h1>in case you didnt love yourself today</h1>

<button id="loveButton" onclick="startStory()">❤️ Love</button>

<div id="photo">
<img id="romanticPhoto" src="photo.jpg">
</div>

<div id="poem">

<div class="line">Aku harap kamu bisa melihat.</div>
<div class="line">Ribuan bintang jatuh dengan segala rasi dan zodiaknya.</div>
<div class="line">Dan aku jatuh untuk pelukmu,</div>
<div class="line">dan kamu memeluk ombak tenang dalam malam.</div>

</div>

<div id="videoSection">
<video controls>
<source src="video.mp4" type="video/mp4">
</video>
</div>

</div>

<!-- OCEAN -->

<div class="ocean">

<svg class="wave-svg" viewBox="0 0 1200 120" preserveAspectRatio="none">
<path d="M0,40 C150,80 350,0 600,40 C850,80 1050,0 1200,40 L1200,120 L0,120 Z" fill="rgba(40,70,120,0.7)"></path>
</svg>

<svg class="wave-svg" viewBox="0 0 1200 120" preserveAspectRatio="none">
<path d="M0,60 C200,20 400,100 600,60 C800,20 1000,100 1200,60 L1200,120 L0,120 Z" fill="rgba(30,60,110,0.6)"></path>
</svg>

</div>

<script>

/* FALLING STARS */

const starContainer=document.getElementById("stars");

for(let i=0;i<60;i++){

const star=document.createElement("div");
star.classList.add("star");

star.style.left=Math.random()*100+"vw";
star.style.animationDuration=(3+Math.random()*4)+"s";
star.style.opacity=Math.random();

starContainer.appendChild(star);

}

/* SHOOTING STAR */

function createShootingStar(){

const star=document.createElement("div");
star.classList.add("shooting-star");

star.style.top=Math.random()*40+"vh";
star.style.left=Math.random()*40+"vw";

star.style.animation="shoot 1.2s ease-out forwards";

document.body.appendChild(star);

setTimeout(()=>{
star.remove();
},1200);

}

setInterval(()=>{
createShootingStar();
},4000 + Math.random()*4000);

/* STORY */

function startStory(){

const button=document.getElementById("loveButton");
button.innerHTML="❤️ Loved";
button.disabled=true;

const photo=document.getElementById("photo");
photo.style.display="block";

setTimeout(()=>{
document.getElementById("romanticPhoto").classList.add("show-photo");
},200);

setTimeout(()=>{
document.getElementById("poem").style.display="block";
},1200);

const lines=document.querySelectorAll(".line");

lines.forEach((line,index)=>{
setTimeout(()=>{
line.classList.add("show-line");
},1500+(index*900));
});

setTimeout(()=>{
photo.style.display="none";
document.getElementById("poem").style.display="none";
},6500);

setTimeout(()=>{
document.getElementById("videoSection").style.display="block";
},7000);

}

</script>

</body>
</html>
